<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EmilY</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>

<nav class="top-nav">
    <a href="/" class="nav-brand">
        <span style="color: var(--primary-color);">E</span>mil<span style="color: var(--primary-color);">Y</span>
    </a>
    <div class="nav-links">
        <a href="/" class="nav-link active"><i class="fas fa-home"></i> Home</a>
        <a href="/results" class="nav-link"><i class="fas fa-file-medical-alt"></i> Results</a>
    </div>
</nav>

<div class="background-blobs">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
</div>

<div class="main-wrapper">
    <div class="container">
        <header class="header">
            <div class="logo">
                <h1><span style="color: var(--primary-color);">E</span>mil<span style="color: var(--primary-color);">Y</span></h1>
            </div>
            <p class="subtitle">Enhanced medical intelligence for logical yield</p>
        </header>

    <form method="post" enctype="multipart/form-data" id="main-upload-form">
        <div class="upload-panels" style="display: flex; gap: 1.5rem; margin-bottom: 2rem; justify-content: center;">
            <!-- Medical Bills Panel -->
            <div class="card" style="margin-bottom: 0; flex: 1; min-width: 0;">
                <h3 style="margin-bottom: 1rem; color: var(--primary-color);"><i class="fas fa-file-invoice-dollar"></i> Medical Bills</h3>
                <div class="upload-section small-drop-zone" id="drop-zone-bill" onclick="document.getElementById('bill-input').click()">
                    <i class="fas fa-cloud-upload-alt upload-icon" style="font-size: 2rem;"></i>
                    <div class="upload-text">
                        <p style="font-size: 0.9rem;">Upload Bills</p>
                    </div>
                    <input type="file" name="bill_files" id="bill-input" class="file-input" accept=".pdf" multiple style="display: none;">
                </div>
                <div id="bill-file-list" class="file-list-mini" style="margin-top: 1rem; font-size: 0.8rem; color: var(--text-muted);"></div>
            </div>

            <!-- Medical Records Panel -->
            <div class="card" style="margin-bottom: 0; flex: 1; min-width: 0;">
                <h3 style="margin-bottom: 1rem; color: var(--secondary-color);"><i class="fas fa-file-medical"></i> Medical Records</h3>
                <div class="upload-section small-drop-zone" id="drop-zone-report" onclick="document.getElementById('report-input').click()">
                    <i class="fas fa-cloud-upload-alt upload-icon" style="font-size: 2rem; color: var(--secondary-color);"></i>
                    <div class="upload-text">
                        <p style="font-size: 0.9rem;">Upload Reports</p>
                    </div>
                    <input type="file" name="report_files" id="report-input" class="file-input" accept=".pdf" multiple style="display: none;">
                </div>
                <div id="report-file-list" class="file-list-mini" style="margin-top: 1rem; font-size: 0.8rem; color: var(--text-muted);"></div>
            </div>

            <!-- Personal Records Panel -->
            <div class="card" style="margin-bottom: 0; flex: 1; min-width: 0;">
                <h3 style="margin-bottom: 1rem; color: #6366f1;"><i class="fas fa-id-card"></i> Personal Records</h3>
                <div class="upload-section small-drop-zone" id="drop-zone-personal" onclick="document.getElementById('personal-input').click()">
                    <i class="fas fa-cloud-upload-alt upload-icon" style="font-size: 2rem; color: #6366f1;"></i>
                    <div class="upload-text">
                        <p style="font-size: 0.9rem;">Upload Personal Info</p>
                    </div>
                    <input type="file" name="personal_files" id="personal-input" class="file-input" accept=".pdf" multiple style="display: none;">
                </div>
                <div id="personal-file-list" class="file-list-mini" style="margin-top: 1rem; font-size: 0.8rem; color: var(--text-muted);"></div>
            </div>
        </div>

        <div class="card" id="process-card" style="display: none;">
            <div id="loading-container" class="loading-container" style="display: none; margin-bottom: 2rem;">
                <div class="progress-info">
                    <span id="progress-text">Processing documents...</span>
                    <span id="progress-percentage">0%</span>
                </div>
                <div class="progress-bar-bg">
                    <div id="progress-bar" class="progress-bar"></div>
                </div>
            </div>

            <button type="submit" class="submit-btn" id="submit-btn">
                <span class="btn-text"><i class="fas fa-magic"></i> Process Documents</span>
                <span class="btn-loader" style="display: none;"><i class="fas fa-circle-notch fa-spin"></i> Processing...</span>
            </button>
        </div>
    </form>

    <footer class="footer">
        <p>&copy; 2025 EmilY. Precision document analysis.</p>
    </footer>
    </div>
</div>

<script>
    const billInput = document.getElementById('bill-input');
    const reportInput = document.getElementById('report-input');
    const personalInput = document.getElementById('personal-input');
    const processCard = document.getElementById('process-card');
    const mainForm = document.getElementById('main-upload-form');
    const submitBtn = document.getElementById('submit-btn');
    const btnText = submitBtn.querySelector('.btn-text');
    const btnLoader = submitBtn.querySelector('.btn-loader');

    function updateFileList(input, listId) {
        const list = document.getElementById(listId);
        if (input.files.length > 0) {
            list.innerHTML = `<ul style="list-style: none; padding: 0;">` + 
                Array.from(input.files).map(f => `<li><i class="fas fa-file-pdf"></i> ${f.name}</li>`).join('') + 
                `</ul>`;
            processCard.style.display = 'block';
        } else {
            list.innerHTML = '';
            checkVisibility();
        }
    }

    function checkVisibility() {
        if (billInput.files.length === 0 && reportInput.files.length === 0 && personalInput.files.length === 0) {
            processCard.style.display = 'none';
        }
    }

    billInput.addEventListener('change', () => updateFileList(billInput, 'bill-file-list'));
    reportInput.addEventListener('change', () => updateFileList(reportInput, 'report-file-list'));
    personalInput.addEventListener('change', () => updateFileList(personalInput, 'personal-file-list'));

    mainForm.addEventListener('submit', (e) => {
        btnText.style.display = 'none';
        btnLoader.style.display = 'inline-block';
        submitBtn.disabled = true;
        submitBtn.style.opacity = '0.8';

        // Show loading progress
        const loadingContainer = document.getElementById('loading-container');
        const progressBar = document.getElementById('progress-bar');
        const progressPercentage = document.getElementById('progress-percentage');
        loadingContainer.style.display = 'block';

        let width = 0;
        const interval = setInterval(() => {
            if (width >= 95) {
                clearInterval(interval);
            } else {
                width += Math.random() * 15;
                if (width > 95) width = 95;
                progressBar.style.width = width + '%';
                progressPercentage.innerText = Math.round(width) + '%';
            }
        }, 150);
    });

    // Drag and Drop support
    function setupDropZone(zoneId, inputId) {
        const zone = document.getElementById(zoneId);
        const input = document.getElementById(inputId);

        ['dragover', 'dragleave', 'drop'].forEach(eventName => {
            zone.addEventListener(eventName, e => {
                e.preventDefault();
                e.stopPropagation();
            });
        });

        zone.addEventListener('dragover', () => zone.classList.add('drag-over'));
        zone.addEventListener('dragleave', () => zone.classList.remove('drag-over'));
        zone.addEventListener('drop', (e) => {
            zone.classList.remove('drag-over');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                const allPDF = Array.from(files).every(file => file.type === 'application/pdf');
                if (allPDF) {
                    input.files = files;
                    updateFileList(input, zoneId.replace('drop-zone-', '') + '-file-list');
                } else {
                    alert('Please upload PDF files only.');
                }
            }
        });
    }

    setupDropZone('drop-zone-bill', 'bill-input');
    setupDropZone('drop-zone-report', 'report-input');
    setupDropZone('drop-zone-personal', 'personal-input');

    function copyToClipboard() {
        const text = document.getElementById('result-text').innerText;
        navigator.clipboard.writeText(text).then(() => {
            const copyBtn = document.querySelector('.copy-btn');
            const originalHTML = copyBtn.innerHTML;
            copyBtn.innerHTML = '<i class="fas fa-check"></i> Copied!';
            copyBtn.classList.add('success');
            setTimeout(() => {
                copyBtn.innerHTML = originalHTML;
                copyBtn.classList.remove('success');
            }, 2000);
        });
    }
</script>

</body>
</html>
